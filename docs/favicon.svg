<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.4"/>
  <!-- Microphone & Waveforms -->
  <g transform="translate(156, 120)">
    <!-- Mic body -->
    <rect x="68" y="20" width="64" height="130" rx="32" fill="url(#grad)" />
    <!-- Mic stand arc -->
    <path d="M 32 90 A 68 68 0 0 0 168 90" fill="none" stroke="#e0f2fe" stroke-width="18" stroke-linecap="round"/>
    <!-- Mic pole -->
    <line x1="100" y1="160" x2="100" y2="210" stroke="#e0f2fe" stroke-width="18" stroke-linecap="round"/>
    <!-- Mic base -->
    <line x1="50" y1="210" x2="150" y2="210" stroke="#e0f2fe" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- Sound waves -->
  <path d="M 80 230 Q 80 190 80 150" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 50 250 Q 50 190 50 130" stroke="#0284c7" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 432 230 Q 432 190 432 150" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 462 250 Q 462 190 462 130" stroke="#0284c7" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- CRM badge pill -->
  <rect x="136" y="380" width="240" height="56" rx="28" fill="#0284c7" />
  <text x="256" y="418" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">AUDIO OGG</text>
</svg>
